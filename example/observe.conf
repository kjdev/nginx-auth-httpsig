# Deployment sample: runs auth_httpsig_mode observe and records signature
# verification results to the access log, without rejecting any request
# based on the outcome. See README.md for how to apply this to a real
# environment and how to read the log.

load_module modules/ngx_http_auth_httpsig_module.so;

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format httpsig_observe
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        'verified="$httpsig_verified" keyid="$httpsig_keyid" '
        'agent="$httpsig_agent" claimed_agent="$http_signature_agent" '
        'error="$httpsig_error"';

    auth_httpsig_key_cache_zone     httpsig_keys:1m;
    auth_httpsig_key_cache_min_ttl  60s;
    auth_httpsig_key_cache_max_ttl  86400s;

    upstream backend {
        server backend.internal:80;
    }

    server {
        listen 443 ssl;
        server_name example.com;

        ssl_certificate     /etc/ssl/certs/example.com.crt;
        ssl_certificate_key /etc/ssl/private/example.com.key;

        access_log /var/log/nginx/httpsig_observe.log httpsig_observe;

        auth_httpsig_profile             web-bot-auth;
        auth_httpsig_mode                observe;

        # Replace with the authority (host[:port]) published in the
        # documentation of the real agent you want to observe. Matching is
        # exact only; wildcards are not supported.
        auth_httpsig_agent_allow          agent.bot.example;

        auth_httpsig_key_directory_request /httpsig_fetch;

        location / {
            proxy_pass http://backend;
        }

        # Internal location dedicated to the key directory fetch. TLS
        # verification is delegated to this location.
        location = /httpsig_fetch {
            internal;

            auth_httpsig_mode              off;
            auth_httpsig_agent_allow       off;

            resolver                        127.0.0.1;
            subrequest_output_buffer_size   128k;

            proxy_ssl_verify                on;
            proxy_ssl_trusted_certificate   /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_server_name           on;
            proxy_ssl_name                  $httpsig_directory_hostname;
            proxy_set_header                Host $httpsig_directory_host;
            proxy_pass_request_headers      off;
            proxy_pass  https://$httpsig_directory_host/.well-known/http-message-signatures-directory;
        }
    }
}
