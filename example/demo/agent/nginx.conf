worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    # $host picks the right JWKS per authority, so rotating a key is just
    # replacing that host's directory.json (no reload needed).
    server {
        listen 443 ssl;
        server_name agent.bot.example crawler.bot.example;

        ssl_certificate     /run/secrets/server.crt;
        ssl_certificate_key /run/secrets/server.key;

        location = /.well-known/http-message-signatures-directory {
            default_type application/http-message-signatures-directory+json;
            add_header   Cache-Control "max-age=5";
            alias        /run/secrets/$host/directory.json;
        }
    }
}
