services:
  # One-shot: generates the CA, the agent's HTTPS server certificate, and
  # the Ed25519 signing keys + JWKS files under ./secrets.
  gen-keys:
    build:
      context: ../..
      dockerfile: example/demo/agent/Dockerfile
    entrypoint: ["/demo/gen-keys.sh"]
    volumes:
      - ./secrets:/run/secrets

  backend:
    image: nginx:alpine
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro

  # Publishes the key directory over HTTPS on two hostnames and doubles as
  # the signing client (demo.sh) that `task verify`/`rotate`/... exec into.
  agent:
    build:
      context: ../..
      dockerfile: example/demo/agent/Dockerfile
    depends_on:
      gen-keys:
        condition: service_completed_successfully
    volumes:
      # Not read-only: the "rotate" scenario overwrites its own
      # directory.json to simulate the agent publishing a new key.
      - ./secrets:/run/secrets
    networks:
      default:
        aliases:
          - agent.bot.example
          - crawler.bot.example

  proxy:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: module
    depends_on:
      gen-keys:
        condition: service_completed_successfully
      backend:
        condition: service_started
      agent:
        condition: service_started
    volumes:
      - ./proxy/observe.conf:/etc/nginx/nginx.conf:ro
      - ./secrets:/run/secrets:ro
    ports:
      - "8080:8080"
