# Working counterpart of ../../observe.conf, wired for this docker compose
# stack: server_name/upstream point at compose service names, key-cache
# TTLs are shortened so key rotation is visible within the demo's timescale,
# and the access log target is /dev/stdout (docker compose logs friendly)
# instead of a file.

load_module modules/ngx_http_auth_httpsig_module.so;

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format httpsig_observe
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        'verified="$httpsig_verified" keyid="$httpsig_keyid" '
        'agent="$httpsig_agent" claimed_agent="$http_signature_agent" '
        'error="$httpsig_error"';

    auth_httpsig_key_cache_zone     httpsig_keys:1m;
    auth_httpsig_key_cache_min_ttl  1s;
    auth_httpsig_key_cache_max_ttl  10s;

    upstream backend {
        server backend:80;
    }

    server {
        listen 8080;
        server_name proxy;

        access_log /dev/stdout httpsig_observe;
        error_log  /dev/stderr info;

        auth_httpsig_profile             web-bot-auth;
        auth_httpsig_mode                observe;

        auth_httpsig_agent_allow          agent.bot.example;
        auth_httpsig_agent_allow          crawler.bot.example;

        auth_httpsig_key_directory_request /httpsig_fetch;

        location / {
            proxy_pass http://backend;
        }

        # Internal location dedicated to the key directory fetch. TLS
        # verification is delegated to this location.
        location = /httpsig_fetch {
            internal;

            auth_httpsig_mode              off;
            auth_httpsig_agent_allow       off;

            resolver                        127.0.0.11 valid=5s;
            subrequest_output_buffer_size   128k;

            proxy_ssl_verify                on;
            proxy_ssl_trusted_certificate   /run/secrets/ca.pem;
            proxy_ssl_server_name           on;
            proxy_ssl_name                  $httpsig_directory_hostname;
            proxy_set_header                Host $httpsig_directory_host;
            proxy_pass_request_headers      off;
            proxy_pass  https://$httpsig_directory_host/.well-known/http-message-signatures-directory;
        }
    }
}
